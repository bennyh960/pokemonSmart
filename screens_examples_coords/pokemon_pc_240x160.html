  body {
    background: #111;

    justify-content: center;
    min-height: 100vh;
    margin: 0;
    font-family: monospace;
    color: #888;
  }
  h2 { color: #4dffb4; font-size: 14px; letter-spacing: 3px; text-transform: uppercase; margin: 0 0 16px; }
  .screen {
    width: 240px; height: 160px;
    background: #0d1a14;
    position: relative;
    overflow: hidden;
    transform: scale(3);
    transform-origin: top center;
    image-rendering: pixelated;
    font-family: monospace;
    -webkit-font-smoothing: none;
    margin-bottom: 340px;
    border: 1px solid #1a4a30;
  }
  .screen * {
    position: absolute;
    font-family: monospace;
    line-height: 1;
    white-space: nowrap;
    margin: 0; padding: 0;
    box-sizing: border-box;
  }
</style>
