<title>PC Storage Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Silkscreen&display=swap">
<style>
/* Layout: game-screen frame — party column | box grid | inspector; stacks on phones. Single dark look (the game's PC). */
:root {
  --bg: #08130e;
  --panel: #0f2219;
  --panel-2: #132c20;
  --line: #1f4a33;
  --line-soft: #173826;
  --fg: #eaf5ee;
  --fg-dim: #8fb19c;
  --fg-mute: #5d7d69;
  --green: #20d860;
  --blue: #5b8cff;
  --red: #ef5b5b;
  --gold: #f8d030;
  --font: 'Rubik', 'Segoe UI', Arial, sans-serif;
  --pixel: 'Silkscreen', 'Courier New', monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
}
button { font: inherit; color: inherit; }
button:focus-visible, .cell:focus-visible, .slot:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.note { max-width: 1100px; margin: 0 auto 12px; color: var(--fg-dim); font-size: 13px; line-height: 1.5; }
.note b { color: var(--fg); }

.pc { max-width: 1100px; margin: 0 auto; background: var(--panel); border: 2px solid var(--line); border-radius: 14px; overflow: hidden; }

.top { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #0b1b13; border-bottom: 2px solid var(--line); }
.top h1 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: .3px; display: flex; align-items: center; gap: 8px; }
.top h1 .pcicon { width: 22px; height: 18px; border: 2px solid var(--green); border-radius: 3px; position: relative; }
.top h1 .pcicon::after { content: ''; position: absolute; left: 4px; right: 4px; bottom: -6px; height: 3px; background: var(--green); border-radius: 2px; }
.top .spacer { flex: 1; }
.chipbtn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel-2); cursor: pointer; font-size: 13px; font-weight: 500; }
.chipbtn:hover { border-color: var(--green); }
.help-btn { background: var(--gold); color: #1b1600; border-color: var(--gold); font-weight: 700; }
.help-btn:hover { filter: brightness(1.1); border-color: var(--gold); }
.help-btn .q { width: 18px; height: 18px; border-radius: 50%; background: #1b1600; color: var(--gold); display: grid; place-items: center; font-size: 12px; font-weight: 800; }
kbd { font-family: var(--pixel); font-size: 10px; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line); background: #0a1912; color: var(--fg-dim); }

.main { display: grid; grid-template-columns: 210px minmax(0, 1fr) 270px; gap: 14px; padding: 14px; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 8px; font-size: 13px; font-weight: 700; color: var(--fg-dim); text-transform: uppercase; letter-spacing: .6px; }
.count { font-family: var(--pixel); font-size: 11px; color: var(--fg-mute); letter-spacing: 0; }
.count.full { color: var(--gold); }

.party { display: grid; gap: 6px; }
.slot { display: grid; grid-template-columns: 44px minmax(0,1fr); align-items: center; gap: 8px; padding: 4px 8px; min-height: 52px; border-radius: 10px; border: 1px solid var(--line-soft); background: var(--panel-2); cursor: pointer; text-align: start; transition: border-color .12s, background .12s; }
.slot:hover { border-color: var(--green); }
.slot.sel { border-color: var(--green); background: #183a28; box-shadow: inset 3px 0 0 var(--green); }
[dir=rtl] .slot.sel { box-shadow: inset -3px 0 0 var(--green); }
.slot.empty { border-style: dashed; color: var(--fg-mute); font-size: 12px; grid-template-columns: 1fr; text-align: center; cursor: default; }
.slot.target { border-color: var(--gold); animation: pulse 1s infinite; }
.slot.drop { border-color: var(--gold); background: #2a2a12; }
.slot img { width: 56px; height: 56px; margin: -6px; image-rendering: pixelated; }
.slot .nm { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot .meta { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
.lv { font-family: var(--pixel); font-size: 10px; color: var(--fg-dim); direction: ltr; }
.hpbar { flex: 1; height: 4px; background: #0a1912; border-radius: 2px; overflow: hidden; }
.hpbar i { display: block; height: 100%; background: var(--green); }
@keyframes pulse { 50% { box-shadow: 0 0 0 3px rgba(248,208,48,.25); } }

.boxbar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.arrow { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2); cursor: pointer; font-size: 16px; display: grid; place-items: center; flex: none; }
.arrow:hover { border-color: var(--green); }
.boxname { flex: 1; min-width: 0; text-align: center; padding: 6px; border-radius: 9px; background: #0b1b13; border: 1px solid var(--line); }
.boxname b { display: block; font-size: 15px; }
.boxname span { font-family: var(--pixel); font-size: 10px; color: var(--fg-mute); }
.boxtabs { display: flex; gap: 4px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 2px; }
.boxtab { flex: none; min-width: 34px; padding: 4px 6px; border-radius: 7px; border: 1px solid var(--line-soft); background: transparent; cursor: pointer; font-family: var(--pixel); font-size: 10px; color: var(--fg-mute); }
.boxtab:hover { border-color: var(--green); color: var(--fg); }
.boxtab.on { background: var(--green); color: #04150b; border-color: var(--green); }
.boxtab.drop { border-color: var(--gold); color: var(--gold); }
.boxtab .fill { display: block; height: 3px; margin-top: 3px; border-radius: 2px; background: #0a1912; overflow: hidden; }
.boxtab .fill i { display: block; height: 100%; background: currentColor; opacity: .7; }

.grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; padding: 10px; border-radius: 12px; background: #0b1b13; border: 1px solid var(--line);
  background-image: radial-gradient(var(--line-soft) 1px, transparent 1px); background-size: 14px 14px; }
.cell { aspect-ratio: 1; max-width: 100%; border-radius: 9px; border: 1px solid var(--line-soft); background: rgba(15,34,25,.85); display: grid; place-items: center; cursor: pointer; padding: 0; position: relative; transition: transform .1s, border-color .1s; }
.cell:hover { border-color: var(--green); transform: translateY(-1px); }
.cell.sel { border: 2px solid var(--green); background: #183a28; }
.cell.cur { border: 2px dashed var(--gold); }
.cell.empty { background: rgba(10,25,18,.6); cursor: default; }
.cell.empty:hover { transform: none; border-color: var(--line-soft); }
.cell.drop { border-color: var(--gold); background: #2a2a12; }
.cell img { width: 100%; height: 100%; image-rendering: pixelated; pointer-events: none; }
.cell .clv { position: absolute; bottom: 2px; inset-inline-end: 4px; font-family: var(--pixel); font-size: 9px; color: var(--fg-dim); direction: ltr; }
.dragging { opacity: .35; }

.insp { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; align-self: start; }
.insp .hero { display: grid; place-items: center; height: 120px; border-radius: 10px; background: radial-gradient(circle at 50% 65%, #1f4a33 0, #0b1b13 70%); }
.insp .hero img { width: 150px; height: 150px; image-rendering: pixelated; }
.insp h2 { margin: 0; font-size: 20px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.where { font-size: 12px; color: var(--fg-mute); }
.types { display: flex; gap: 4px; }
.type { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; color: #fff; text-transform: uppercase; letter-spacing: .4px; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 13px; margin: 0; }
.facts dt { color: var(--fg-mute); }
.facts dd { margin: 0; }
.actions { display: grid; gap: 8px; }
.act { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid transparent; cursor: pointer; font-weight: 700; font-size: 14px; text-align: start; }
.act small { display: block; font-weight: 400; font-size: 12px; opacity: .8; }
.act .ico { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-size: 16px; flex: none; background: rgba(0,0,0,.25); }
.act .k { margin-inline-start: auto; }
.act.primary.withdraw { background: var(--green); color: #04150b; }
.act.primary.deposit { background: var(--blue); color: #fff; }
.act.secondary { background: transparent; border-color: var(--line); color: var(--fg); }
.act.danger { background: transparent; border-color: rgba(239,91,91,.45); color: var(--red); }
.act:hover:not(:disabled) { filter: brightness(1.1); }
.act.danger:hover:not(:disabled) { background: rgba(239,91,91,.1); }
.act:disabled { opacity: .45; cursor: not-allowed; }
.hint { font-size: 12px; color: var(--gold); line-height: 1.45; margin: 0; }
.empty-insp { text-align: center; color: var(--fg-mute); font-size: 13px; padding: 28px 8px; line-height: 1.6; }

.keys { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 10px 14px; border-top: 2px solid var(--line); background: #0b1b13; font-size: 12px; color: var(--fg-mute); }
.keys span { display: inline-flex; align-items: center; gap: 5px; }

.banner { margin: 12px 14px 0; padding: 8px 12px; border-radius: 10px; background: #2a2a12; border: 1px solid var(--gold); color: var(--gold); font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 10px; }
.banner button { margin-inline-start: auto; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: #0b1b13; border: 1px solid var(--green); border-radius: 12px; padding: 10px 12px 10px 16px; display: flex; align-items: center; gap: 14px; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.5); max-width: calc(100% - 32px); z-index: 20; }
.toast.err { border-color: var(--red); }
.toast button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer; font-weight: 700; color: var(--gold); }

.scrim { position: fixed; inset: 0; background: rgba(2,8,5,.72); display: grid; place-items: center; padding: 16px; z-index: 30; }
.modal { width: min(460px, 100%); max-height: calc(100% - 32px); overflow: auto; background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 18px; }
.modal h3 { margin: 0 0 6px; font-size: 19px; }
.modal p { margin: 0 0 12px; color: var(--fg-dim); line-height: 1.55; font-size: 14px; }
.release-hero { display: grid; place-items: center; margin: 4px 0 10px; }
.release-hero img { width: 120px; height: 120px; image-rendering: pixelated; filter: drop-shadow(0 6px 0 rgba(0,0,0,.35)); }
.row-btns { display: flex; gap: 8px; }
.row-btns .act { justify-content: center; }
.hold { position: relative; overflow: hidden; }
.hold .bar { position: absolute; inset-block: 0; inset-inline-start: 0; width: 0; background: rgba(239,91,91,.3); }
.help-list { display: grid; gap: 12px; margin: 0 0 14px; padding: 0; list-style: none; }
.help-list li { display: grid; grid-template-columns: 38px 1fr; gap: 10px; align-items: start; }
.help-list .ico { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; font-size: 18px; }
.help-list b { display: block; margin-bottom: 2px; }
.help-list span { color: var(--fg-dim); font-size: 13px; line-height: 1.5; }
.help-keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; font-size: 13px; color: var(--fg-dim); padding: 10px; border-radius: 10px; background: #0b1b13; margin-bottom: 14px; }

@media (max-width: 900px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .party { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .slot { grid-template-columns: 36px minmax(0,1fr); padding: 4px 6px; }
  .slot img { width: 46px; height: 46px; margin: -5px; }
  .slot .nm { font-size: 12px; }
}
@media (max-width: 480px) {
  .party { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid { gap: 4px; padding: 6px; }
  .keys { display: none; }
  .top h1 { font-size: 15px; }
  .chipbtn .lbl { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="pc" id="app"></div>

let lang = 'he';
const S = () => STR[lang];
const nameOf = p => sp[p.id][lang];

let uid = 0;
function mon(id, level) {
  return { uid: ++uid, id, level, hp: Math.min(1, 0.45 + ((id * 37) % 55) / 100), nature: NATURES[id % NATURES.length], ability: ABILITIES[id % ABILITIES.length] };
}

let state = {
  party: [mon(25, 18), mon(4, 14), mon(1, 12), mon(16, 9), mon(41, 8)],
  boxes: Array.from({ length: 10 }, () => Array(30).fill(null)),
};
[[7,11,0],[152,6,1],[155,7,3],[158,5,4],[10,4,6],[13,3,7],[19,6,8],[35,9,12],[39,8,13],[54,10,15],[60,7,17],[63,12,18],[66,11,20],[74,9,23],[92,13,25],[129,5,29]]
  .forEach(([id, lv, slot]) => state.boxes[0][slot] = mon(id, lv));
[[133,15,2],[25,7,4],[16,4,9]].forEach(([id, lv, slot]) => state.boxes[1][slot] = mon(id, lv));

// sel = the Pokémon shown in the inspector; zone/cursor = keyboard focus; swapFrom = box slot waiting for a team partner
let ui = { box: 0, sel: { zone: 'box', idx: 0 }, zone: 'box', cursor: 0, swapFrom: null, modal: null, toast: null, dragOver: null };
let undoSnap = null, toastTimer = null;

const clone = o => JSON.parse(JSON.stringify(o));
const selected = () => !ui.sel ? null : ui.sel.zone === 'party' ? state.party[ui.sel.idx] : state.boxes[ui.box][ui.sel.idx];
const boxCount = b => state.boxes[b].filter(Boolean).length;

function commit(msg, err) {
  ui.toast = { msg, err, undo: !err && !!undoSnap };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { ui.toast = null; undoSnap = null; renderLayer(); }, 5000);
  render();
}
function snapshot() { undoSnap = { state: clone(state), box: ui.box, sel: ui.sel }; }
function undo() {
  if (!undoSnap) return;
  state = undoSnap.state; ui.box = undoSnap.box; ui.sel = undoSnap.sel; undoSnap = null; ui.toast = null; render();
}

// ── Actions ──
function deposit(pIdx, box = ui.box, slot = null) {
  if (state.party.length <= 1) return commit(S().lastOne, true);
  const target = slot ?? state.boxes[box].indexOf(null);
  if (target < 0) return commit(S().boxFull(box + 1), true);
  snapshot();
  const p = state.party.splice(pIdx, 1)[0];
  state.boxes[box][target] = p;
  ui.box = box; ui.sel = { zone: 'box', idx: target }; ui.zone = 'box'; ui.cursor = target;
  commit(S().depositedT(nameOf(p), box + 1));
}
function withdraw(bIdx) {
  if (state.party.length >= 6) { ui.swapFrom = bIdx; ui.sel = { zone: 'box', idx: bIdx }; ui.zone = 'party'; ui.cursor = 0; return render(); }
  snapshot();
  const p = state.boxes[ui.box][bIdx]; state.boxes[ui.box][bIdx] = null; state.party.push(p);
  ui.sel = { zone: 'party', idx: state.party.length - 1 };
  commit(S().withdrawnT(nameOf(p)));
}
function swap(pIdx, bIdx, box = ui.box) {
  snapshot();
  const a = state.party[pIdx], b = state.boxes[box][bIdx];
  state.party[pIdx] = b; state.boxes[box][bIdx] = a; ui.swapFrom = null;
  ui.sel = { zone: 'party', idx: pIdx };
  commit(S().swappedT(nameOf(b), nameOf(a)));
}
function moveInBox(from, to) {
  snapshot();
  const b = state.boxes[ui.box]; [b[from], b[to]] = [b[to], b[from]];
  ui.sel = { zone: 'box', idx: to };
  commit(S().movedT(nameOf(b[to])));
}
function moveToBox(fromIdx, box) {
  const target = state.boxes[box].indexOf(null);
  if (target < 0) return commit(S().boxFull(box + 1), true);
  snapshot();
  const p = state.boxes[ui.box][fromIdx]; state.boxes[ui.box][fromIdx] = null; state.boxes[box][target] = p;
  ui.sel = null;
  commit(S().movedT(nameOf(p)));
}
function release() {
  const s = ui.sel, p = selected(); if (!p) return;
  snapshot();
  if (s.zone === 'party') state.party.splice(s.idx, 1); else state.boxes[ui.box][s.idx] = null;
  ui.sel = null; ui.modal = null;
  commit(S().releasedT(nameOf(p)));
}
function askRelease() {
  if (!selected() || ui.swapFrom !== null) return;
  if (ui.sel.zone === 'party' && state.party.length <= 1) return commit(S().lastOne, true);
  ui.modal = 'release'; render();
}
function primary() {
  if (ui.swapFrom !== null) { if (ui.zone === 'party' && state.party[ui.cursor]) swap(ui.cursor, ui.swapFrom); return; }
  const s = ui.sel; if (!s || !selected()) return;
  if (s.zone === 'party') deposit(s.idx); else withdraw(s.idx);
}
// activate = a click (in swap mode it picks the team partner); keyboard arrows only move the focus
function pick(zone, idx, activate = true) {
  if (ui.swapFrom !== null) {
    if (activate) {
      if (zone === 'party' && state.party[idx]) return swap(idx, ui.swapFrom);
      ui.swapFrom = null;
    } else {
      ui.zone = zone; ui.cursor = idx; return render();
    }
  }
  ui.zone = zone; ui.cursor = idx;
  const exists = zone === 'party' ? state.party[idx] : state.boxes[ui.box][idx];
  ui.sel = exists ? { zone, idx } : null;
  render();
}
function setBox(b) { ui.box = (b + 10) % 10; if (ui.sel?.zone === 'box') ui.sel = null; ui.swapFrom = null; render(); }

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

function partyHTML() {
  const s = S(); let h = '';
  for (let i = 0; i < 6; i++) {
    const p = state.party[i];
    if (!p) { h += `<div class="slot empty${ui.dragOver === `party:${i}` ? ' drop' : ''}" data-drop="party:${i}">${s.emptySlot}</div>`; continue; }
    const sel = ui.swapFrom !== null ? ui.zone === 'party' && ui.cursor === i : ui.sel?.zone === 'party' && ui.sel.idx === i;
    const cls = ['slot', sel && 'sel', ui.swapFrom !== null && 'target', ui.dragOver === `party:${i}` && 'drop'].filter(Boolean).join(' ');
    h += `<button class="${cls}" data-pick="party:${i}" data-drag="party:${i}" data-drop="party:${i}" draggable="true">

    </button>`;
  }
  return h;
}

function gridHTML() {
  let h = '';

    const cur = !sel && ui.zone === 'box' && ui.cursor === i;
    const drop = ui.dragOver === `box:${i}`;
    if (!p) { h += `<div class="cell empty${drop ? ' drop' : ''}${cur ? ' cur' : ''}" data-drop="box:${i}"></div>`; return; }

    <div>
      <h2>${esc(nameOf(p))} <span class="lv" style="font-size:12px">Lv ${p.level}</span></h2>

    <div class="actions">

// Hold-to-release: a 0.9 s press (mouse, touch, or holding Enter / Space on the button)
function setupHold() {
  const btn = document.getElementById('hold-btn'), bar = btn.querySelector('.bar');
  let t0 = null, raf = null;
  const tick = now => { const k = Math.min(1, (now - t0) / 900); bar.style.width = k * 100 + '%'; if (k >= 1) { stop(); release(); } else raf = requestAnimationFrame(tick); };
  const start = e => { e.preventDefault(); if (t0 !== null) return; t0 = performance.now(); raf = requestAnimationFrame(tick); };
  const stop = () => { cancelAnimationFrame(raf); t0 = null; bar.style.width = '0'; };
  btn.addEventListener('pointerdown', start);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
  btn.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && !e.repeat) start(e); });
  btn.addEventListener('keyup', e => { if (e.key === 'Enter' || e.key === ' ') stop(); });
}

document.addEventListener('click', e => {
  const a = e.target.closest('[data-act], [data-stop]');
  if (a && a.dataset.act) {
    const act = a.dataset.act;
    if (act === 'help') { ui.modal = 'help'; return render(); }
    if (act === 'lang') { lang = lang === 'he' ? 'en' : 'he'; return render(); }
    if (act === 'close') return commit(S().closeToast, true);
    if (act === 'close-modal') { ui.modal = null; return render(); }
    if (act === 'undo') return undo();
    if (act === 'primary') return primary();
    if (act === 'release') return askRelease();
    if (act === 'prev-box') return setBox(ui.box - 1);
    if (act === 'next-box') return setBox(ui.box + 1);
    if (act === 'cancel-swap') { ui.swapFrom = null; return render(); }
  }
  if (a) return; // clicks inside a modal body
  const b = e.target.closest('[data-box]'); if (b) return setBox(+b.dataset.box);
  const p = e.target.closest('[data-pick]');
  if (p) { const [zone, idx] = p.dataset.pick.split(':'); pick(zone, +idx); }
});
document.addEventListener('dblclick', e => {
  const p = e.target.closest('[data-pick]');
  if (p && !ui.modal && ui.swapFrom === null) { const [zone, idx] = p.dataset.pick.split(':'); ui.sel = { zone, idx: +idx }; primary(); }
});

// Drag & drop: team ⇄ box cells, box cell → box cell, any → box tab
let drag = null;
document.addEventListener('dragstart', e => {
  const d = e.target.closest('[data-drag]'); if (!d) return;
  drag = d.dataset.drag; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', drag);
  requestAnimationFrame(() => d.classList.add('dragging'));
});
document.addEventListener('dragend', () => { drag = null; ui.dragOver = null; render(); });
document.addEventListener('dragover', e => {
  const t = e.target.closest('[data-drop]'); if (!drag || !t) return;
  e.preventDefault();
  if (ui.dragOver !== t.dataset.drop) { ui.dragOver = t.dataset.drop; document.querySelectorAll('.drop').forEach(x => x.classList.remove('drop')); t.classList.add('drop'); }
});
document.addEventListener('drop', e => {
  const t = e.target.closest('[data-drop]'); if (!drag || !t) return;
  e.preventDefault();
  const [fz, fi] = drag.split(':'), [tz, ti] = t.dataset.drop.split(':'), f = +fi, to = +ti;
  drag = null; ui.dragOver = null; ui.swapFrom = null;
  if (fz === 'party' && tz === 'box') return state.boxes[ui.box][to] ? swap(f, to) : deposit(f, ui.box, to);
  if (fz === 'party' && tz === 'tab') return deposit(f, to);
  if (fz === 'box' && tz === 'party') return state.party[to] ? swap(to, f) : withdraw(f);
  if (fz === 'box' && tz === 'box' && f !== to) return moveInBox(f, to);
  if (fz === 'box' && tz === 'tab' && to !== ui.box) return moveToBox(f, to);
  render();
});

// Keyboard
document.addEventListener('keydown', e => {
  if (ui.modal) { if (e.key === 'Escape') { ui.modal = null; render(); } return; }
  const k = e.key, rtl = lang === 'he';
  if (k === '?') { ui.modal = 'help'; return render(); }
  if (k === 'l' || k === 'L') { lang = lang === 'he' ? 'en' : 'he'; return render(); }
  if (k === 'Escape') { if (ui.swapFrom !== null) { ui.swapFrom = null; render(); } else commit(S().closeToast, true); return; }
  if (k === 'Tab') { e.preventDefault(); return pick(ui.zone === 'box' ? 'party' : 'box', 0, false); }
  if (k === 'q' || k === 'Q') return setBox(ui.box - 1);
  if (k === 'e' || k === 'E') return setBox(ui.box + 1);
  if (k === 'Enter') { if (e.target.closest('button')) return; e.preventDefault(); return primary(); }
  if (k === 'r' || k === 'R' || k === 'Delete') return askRelease();
  const dir = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [rtl ? 1 : -1, 0], ArrowRight: [rtl ? -1 : 1, 0] }[k];
  if (!dir) return;
  e.preventDefault();
  if (ui.zone === 'party') {
    const n = Math.max(1, state.party.length);
    pick('party', (ui.cursor + dir[1] + n) % n, false);
  } else {
    const c = Math.max(0, Math.min(5, ui.cursor % 6 + dir[0])), r = Math.max(0, Math.min(4, Math.floor(ui.cursor / 6) + dir[1]));
    pick('box', r * 6 + c, false);
  }
});

render();
</script>
