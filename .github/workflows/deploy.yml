name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# הגדרת הרשאות חובה עבור GitHub Pages ומזהי אבטחה
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # public/audio/ is gitignored (too big for main) — its only copy is the gh-pages branch.
      # Without this step the deployed game has no sound.
      - name: Restore Audio From gh-pages
        run: |
          git fetch --depth=1 origin gh-pages
          mkdir -p public
          git archive FETCH_HEAD audio | tar -x -C public
          test -n "$(ls -A public/audio)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build React App
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Build Output
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
